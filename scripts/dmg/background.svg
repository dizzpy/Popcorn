<!--
  The DMG window background, 660x420 points. Finder places the two icons at
  ICON_* in scripts/package.sh, either side of the arrow.

  Finder always draws icon labels in black over a background image, which
  cannot be read on a dark one. So Finder's labels sit to the right of the
  icons, black on near-black where they disappear, and the names are drawn
  here instead, under the icons.

  After editing, re-render background.png (660x420) and background@2x.png
  (1320x840) with any SVG renderer, e.g. a browser screenshot.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <rect width="660" height="420" fill="rgb(11 11 12)"/>
  <g font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" text-anchor="middle">
    <text x="330" y="84" font-size="21" font-weight="600" letter-spacing="-0.3" fill="rgb(240 238 233)">Install Popcorn</text>
    <text x="330" y="108" font-size="13" fill="rgb(140 138 134)">Drag the app into your Applications folder.</text>
    <text x="150" y="282" font-size="13" fill="rgb(220 218 213)">Popcorn</text>
    <text x="510" y="282" font-size="13" fill="rgb(220 218 213)">Applications</text>
    <text x="330" y="386" font-size="11.5" fill="rgb(125 123 119)">First launch: right-click Popcorn and choose Open.</text>
  </g>
  <g fill="none" stroke="rgb(98 96 93)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 212H388"/>
    <path d="M380 205l8 7-8 7"/>
  </g>
</svg>
