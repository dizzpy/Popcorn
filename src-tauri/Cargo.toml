[package]
name = "popcorn"
version = "0.2.1"
description = "A lightweight local movie and TV library with a built-in player"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.91"

[lib]
name = "popcorn_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
walkdir = "2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
notify-debouncer-full = { version = "0.8", default-features = false, features = ["macos_fsevent"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
log = { version = "0.4", features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
